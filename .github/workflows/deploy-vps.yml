name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Pull, build, and restart PM2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: /var/www/tronx-ai-dashboard
          APP_NAME: tronx-ai-dashboard
          HEALTHCHECK_URL: https://tronx.vn/login
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tronx_deploy_key
          chmod 600 ~/.ssh/tronx_deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/tronx_deploy_key \
            -p "${VPS_PORT:-22}" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' HEALTHCHECK_URL='$HEALTHCHECK_URL' bash -s" <<'DEPLOY'
          set -euo pipefail

          cd "$APP_DIR"
          git fetch origin main
          git pull --ff-only origin main
          npm ci
          npm run build
          pm2 restart "$APP_NAME" --update-env
          pm2 save
          curl -fsS -I "$HEALTHCHECK_URL" >/dev/null
          DEPLOY
